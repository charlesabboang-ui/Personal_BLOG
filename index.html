 <style>
:root{--bg:#fbfaf7;--ink:#1d2421;--muted:#5d6a64;--accent:#1f6f5c;--line:#dcdfd8;--card:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a18;--ink:#e9eeeb;--muted:#9aa8a1;--accent:#5fcfb2;--line:#2a3532;--card:#1a2220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a18;--ink:#e9eeeb;--muted:#9aa8a1;--accent:#5fcfb2;--line:#2a3532;--card:#1a2220;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.7 Literata,Georgia,serif}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.brand{font:700 18px "Inter",system-ui,sans-serif;color:var(--ink);text-decoration:none}
.brand span{color:var(--accent)}
nav{display:flex;gap:14px;align-items:center;font:500 15px "Space Grotesk",system-ui,sans-serif}
nav a,nav button{color:var(--muted);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:6px 2px}
nav a:hover,nav button:hover,nav .on{color:var(--accent)}
nav .lang{border:1px solid var(--line);border-radius:4px;padding:4px 10px;color:var(--ink)}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.15}
h1{font-size:clamp(30px,7vw,44px);margin:36px 0 12px;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 4px}
.lead{color:var(--muted);font-size:19px}
.hero{display:flex;gap:18px;align-items:center;margin-top:30px}
.hero img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex:none}
.post-item{display:block;padding:18px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.post-item:hover h2{color:var(--accent)}
.meta{font:500 13px "Space Grotesk",system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tag{color:var(--accent)}
article p,article li{max-width:62ch}
article h2{margin:28px 0 8px}
.eq{background:var(--card);border-left:3px solid var(--accent);padding:12px 16px;font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:20px;overflow-x:auto;margin:18px 0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.back{display:inline-block;margin-top:22px;font:500 15px "Space Grotesk",system-ui,sans-serif}
.tl{list-style:none;margin:24px 0 0;padding:0 0 0 18px;border-left:2px solid var(--accent)}.tl li{position:relative;margin-bottom:24px}.tl li::before{content:"";position:absolute;left:-25px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--accent)}.tl .meta{display:block}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

nav{flex-wrap:wrap;justify-content:flex-end}
.hero2{padding:40px 0 8px}.hero2 img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--accent)}
.hero2 h1{margin:18px 0 8px}
.btn{display:inline-block;background:var(--accent);color:var(--bg);text-decoration:none;font:500 16px "Space Grotesk",system-ui,sans-serif;padding:12px 20px;border-radius:4px;margin:6px 8px 6px 0}
.btn.alt{background:transparent;color:var(--accent);border:2px solid var(--accent);padding:10px 18px}
.grid{display:grid;gap:14px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;color:inherit;text-decoration:none;display:block}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:var(--muted);font-size:16px}
.card:hover{border-color:var(--accent)}
ul.clean{padding-left:20px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
article p{white-space:pre-line}
